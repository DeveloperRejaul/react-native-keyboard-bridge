name: Release

on:
  push:
    branches: [main]
    paths: ['src/package.json']
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag, release & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Determine version and whether it's new
        id: version
        run: |
          VERSION=$(node -p "require('./src/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — nothing to release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.version.outputs.is_new == 'true'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v${{ steps.version.outputs.version }}." > release-notes.md
          fi

      - name: Tag and create GitHub Release
        if: steps.version.outputs.is_new == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

      - name: Copy README/LICENSE for npm
        if: steps.version.outputs.is_new == 'true'
        run: cp README.md LICENSE src/

      - name: Publish to npm
        if: steps.version.outputs.is_new == 'true'
        working-directory: src
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
